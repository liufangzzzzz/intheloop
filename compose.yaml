services:
  site:
    image: ${ITL_REGISTRY:-crpi-sf6d3yw2nfnffiwh.cn-beijing.personal.cr.aliyuncs.com/geekpark-test}/intheloop:${ITL_IMAGE_TAG:-latest}
    # build: .
    restart: unless-stopped
    environment:
      ITL_PUBLIC_ORIGIN: ${ITL_PUBLIC_ORIGIN:-https://intheloop.geekpark.net}
      INTHELOOP_CONTENT_API_ORIGIN: ${INTHELOOP_CONTENT_API_ORIGIN:-https://toolkit-intheloop.geekpark.net}
    ports:
      - "127.0.0.1:${ITL_PORT:-3001}:3000"
